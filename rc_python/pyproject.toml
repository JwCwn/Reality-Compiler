[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-compiler"
version = "0.1.0"
description = "Reality Compiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
  "PyYAML>=6.0.1",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0.12.20240808",
]

[project.scripts]
rc = "rc.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# --------------------
# Ruff (lint + format)
# --------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = [
  "E", "F",   # pycodestyle, pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "RUF",      # ruff-specific
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------
# Pytest
# --------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]

# --------------------
# Coverage (pytest-cov)
# --------------------
[tool.coverage.run]
source = ["rc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# --------------------

# --------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["rc"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
